[project]
name = "scf-auto-crosswalker"
version = "0.1.0"
description = "LLM-suggested mappings from IT policies and cloud findings to Secure Controls Framework (SCF) controls, checked against the SCF database, for human review"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tiago Brachini" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.2.3,<3",
    "openpyxl>=3.1.2",
    "requests>=2.33.0,<3",
    "streamlit>=1.54.0,<2",
    "python-dotenv>=1.2.2,<2",
    "langchain-groq>=0.1.0",
    "groq>=0.9.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.7.0",
    "pdfplumber>=0.10.3",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "tenacity>=8.2.0",
]

[project.urls]
Repository = "https://github.com/tvobrachini/scf-auto-crosswalker"
Issues = "https://github.com/tvobrachini/scf-auto-crosswalker/issues"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"] # Skip assert usage only; B105 re-enabled to detect real hardcoded secrets

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.3.0",
    "pyright>=1.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Pyright settings live in pyrightconfig.json (it takes precedence over a
# [tool.pyright] table, so keeping both would only drift).
