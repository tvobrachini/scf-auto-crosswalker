services:
  scf-app:
    build: .
    # Published on localhost only: the app has no login, and anyone who can
    # reach it can spend the Groq key.
    ports:
      - "127.0.0.1:8501:8501"
    # Named volumes, not bind mounts: the app runs as the non-root `app` user,
    # and Docker seeds new named volumes from the image's directories (owned
    # by `app`), so they stay writable.
    volumes:
      - scf-data:/app/data
      - model-cache:/app/.cache
    env_file:
      - path: .env
        required: false
    # DEMO_MODE=1 (from the shell or .env) runs the synthetic demo: no Groq
    # key, no SCF download and no Hugging Face download.
    environment:
      DEMO_MODE: ${DEMO_MODE:-0}
    restart: unless-stopped

volumes:
  scf-data:
  model-cache:
