name: CodiumAI PR-Agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # Only run for trusted senders, and never for a pull_request event whose
    # head repo is a fork (forks would otherwise get our OPENAI_API_KEY and
    # write access to issues/PRs on the base repo).
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    name: Run PR Agent on every pull request
    steps:
      - name: PR Agent action step
        id: pragent
        uses: Codium-ai/pr-agent@d82f7d3e696cd00822694aaa3096265d3889f3f1 # v0.34
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          pr_description.extra_instructions: "Please ensure all Python code strictly utilizes `uv` for dependency management. Flag any legacy `requirements.txt` or `pip install` commands. Flag any committed SCF data (`data/` is generated at runtime and must not be redistributed)."
          pr_reviewer.extra_instructions: "Evaluate the code against standard Audit Engineering principles. Every control ID shown to the user must be validated against the SCF database, and control text must come from the database, not the model. Highlight any unauthorized bypassing of security checks or hardcoded API keys."
          pr_code_suggestions.extra_instructions: "Suggest strict Pydantic v2 schemas where applicable. Keep logic in src/ and Streamlit UI code in app.py or src/ui/."
